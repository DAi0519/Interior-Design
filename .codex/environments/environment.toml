# [INPUT]: 依赖run-workspace.sh与launchctl，启动脚本复用launcher.mjs的端口配置
# [OUTPUT]: Codex运行/停止工作台动作；从同一端口配置探测、启动并打开现有入口
# [POS]: 本项目桌面运行配置，本机固定入口由.env.local的PORT=4192管理
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
version = 1
name = "Interior Design"

[setup]
script = ""

[[actions]]
name = "运行工作台"
icon = "run"
command = "bash .codex/environments/run-workspace.sh"
platform = "darwin"

[[actions]]
name = "停止工作台"
icon = "stop"
command = "launchctl remove com.canvas-lab.workspace >/dev/null 2>&1 || true"
platform = "darwin"
