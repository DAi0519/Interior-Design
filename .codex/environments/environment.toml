# [INPUT]: 依赖launcher.mjs的resolvePort、.env.local与launchctl
# [OUTPUT]: Codex运行/停止工作台动作；从同一端口配置探测、启动并打开现有入口
# [POS]: 本项目桌面运行配置，本机固定入口由.env.local的PORT=4192管理
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
version = 1
name = "Interior Design"

[setup]
script = ""

[[actions]]
name = "运行工作台"
icon = "run"
command = "entry_port=\"$(node --input-type=module -e 'import {readFileSync} from \"node:fs\"; import {resolvePort} from \"./launcher.mjs\"; let envFileText=\"\"; try {envFileText=readFileSync(\".env.local\",\"utf8\")} catch {} process.stdout.write(String(resolvePort({envFileText,environmentPort:process.env.PORT})))')\"; entry_url=\"http://127.0.0.1:$entry_port\"; if ! curl -fsS \"$entry_url/\" >/dev/null 2>&1; then npm_path=\"$(command -v npm)\"; cli_path=\"$PWD/node_modules/.bin/lark-cli\"; if [ ! -x \"$cli_path\" ]; then cli_path=\"$(command -v lark-cli)\"; fi; runtime_path=\"$(dirname \"$npm_path\"):$(dirname \"$cli_path\"):/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"; launchctl remove com.canvas-lab.workspace >/dev/null 2>&1 || true; launchctl submit -l com.canvas-lab.workspace -o /tmp/canvas-lab.log -e /tmp/canvas-lab.log -- /usr/bin/env \"PATH=$runtime_path\" \"LARK_CLI_PATH=$cli_path\" \"$npm_path\" --prefix \"$PWD\" start; fi; attempt=0; until curl -fsS \"$entry_url/\" >/dev/null 2>&1; do attempt=$((attempt + 1)); if [ \"$attempt\" -ge 50 ]; then tail -n 20 /tmp/canvas-lab.log; exit 1; fi; sleep 0.1; done; open \"$entry_url\""
platform = "darwin"

[[actions]]
name = "停止工作台"
icon = "stop"
command = "launchctl remove com.canvas-lab.workspace >/dev/null 2>&1 || true"
platform = "darwin"
