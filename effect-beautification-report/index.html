<!doctype html>
<!--
[INPUT]: 依赖公开展示快照、同目录交互脚本/样式与评测图片
[OUTPUT]: 提供五场景五光影四模型的静态对比页面
[POS]: 光影美化评测公开站点入口
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>效果图美化 · 光影模板四模型对比</title><link rel="stylesheet" href="report.css"></head>
<body><main>
<header class="report-header"><div><p class="eyebrow">效果图美化评测 <span id="reportState"></span></p><h1>效果图美化 · 光影模板四模型对比</h1><p class="intro">同一张原图，同一种光影，四个模型并排看。</p><p class="report-meta" id="reportMeta"></p></div><div class="progress-summary"><strong id="successCount">—</strong><span id="progressLabel">正在读取结果</span><div class="progress-track"><span id="progressFill"></span></div><p id="progressDetails"></p></div></header>
<section class="controls" aria-label="评测筛选"><div class="filter-line"><span class="filter-label">原图</span><div id="sampleNavigation" class="sample-navigation"></div></div><div class="filter-line lighting-line"><span class="filter-label">光影</span><div id="lightingNavigation" class="lighting-navigation"></div></div><div class="control-footer"><p id="selectionSummary" aria-live="polite"></p><button id="refreshReport" type="button">刷新进度</button></div></section>
<section id="comparisonResults" aria-label="原图与四模型结果"></section>
<details class="report-notes"><summary>评测范围与说明</summary><ul id="reportNotes"></ul><p id="reportSource"></p></details>
<footer>点击图片可放大查看原件。成图状态与画质判断分别记录，本页不自动评分。</footer>
</main>
<dialog id="imageDialog" aria-labelledby="dialogTitle"><div class="dialog-toolbar"><div><h2 id="dialogTitle"></h2><p id="dialogMeta"></p></div><div class="dialog-actions"><button id="dialogPrevious" type="button" aria-label="上一张">←</button><button id="dialogNext" type="button" aria-label="下一张">→</button><button id="dialogSource" type="button">对照原图</button><button id="dialogScale" type="button">100%</button><a id="dialogOriginal" target="_blank" rel="noopener">打开原件</a><button id="dialogClose" type="button" aria-label="关闭查看器">关闭</button></div></div><div id="dialogImageStage" class="dialog-stage"><img id="dialogImage" alt=""></div></dialog>
<script src="report-data.js"></script><script src="report.js"></script></body></html>
