<!doctype html>
<!--
[INPUT]: 依赖摄影机球控件及本地试跑服务
[OUTPUT]: 摄影机球与特写/标准/远景三档、长边最高2K输入说明与原图/实际结果对比
[POS]: public/prototypes/multi-angle 的独立测试页，不接入生产入口
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多角度编辑 · Canvas Lab</title><link rel="stylesheet" href="/camera.css"></head><body><main>
<header class="page-head"><h1>Canvas Lab</h1><span class="tag">多角度 · MaaS 试跑</span></header>

<div id="camera-sphere-v2" class="viz-dotted-background">

<section class="cs-panel" aria-label="多角度编辑">
  <header class="cs-head"><span class="cs-title">多角度编辑</span><button class="cs-reset cursor-interaction" type="button" data-reset>重置参数 <span aria-hidden="true">↶</span></button></header>
  <div class="cs-layout">
    <div class="cs-stage" aria-label="拖动球面改变摄影机方位，也可使用右侧滑杆调整">
      <canvas data-scene role="img" aria-label="摄影机围绕球心原图移动，视锥指向原图"></canvas>
      <canvas class="cs-camera-front" aria-hidden="true"></canvas>
      <button class="cs-camera-handle" type="button" aria-label="拖动摄影机，或使用方向键调整机位" hidden></button>
      <button class="cs-photo cursor-interaction" type="button" data-photo aria-label="选择本地参考图片，生成时发送至 MaaS"><span>选择原图</span></button>
      <input class="cs-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="参考图片"/>
      <button class="cs-nudge cs-up cursor-interaction" type="button" data-nudge="up" aria-label="提高机位">⌃</button>
      <button class="cs-nudge cs-down cursor-interaction" type="button" data-nudge="down" aria-label="降低机位">⌄</button>
      <button class="cs-nudge cs-left cursor-interaction" type="button" data-nudge="left" aria-label="向左旋转摄影机">‹</button>
      <button class="cs-nudge cs-right cursor-interaction" type="button" data-nudge="right" aria-label="向右旋转摄影机">›</button>
      <span class="cs-stage-label">拖动调整机位</span>
    </div>
    <div class="cs-controls">
      <div class="cs-label">摄像机方位</div>
      <div class="cs-presets" aria-label="常用摄影机方位">
        <button type="button" class="cursor-interaction" data-preset="315,45"><span class="cs-arrow">↘</span>左上</button><button type="button" class="cursor-interaction" data-preset="0,60"><span class="cs-arrow">↓</span>上方</button><button type="button" class="cursor-interaction" data-preset="45,45"><span class="cs-arrow">↙</span>右上</button>
        <button type="button" class="cursor-interaction" data-preset="270,0"><span class="cs-arrow">→</span>左侧</button><button type="button" class="cursor-interaction" data-preset="0,0"><span class="cs-arrow">•</span>正面</button><button type="button" class="cursor-interaction" data-preset="90,0"><span class="cs-arrow">←</span>右侧</button>
        <button type="button" class="cursor-interaction" data-preset="315,-30"><span class="cs-arrow">↗</span>左下</button><button type="button" class="cursor-interaction" data-preset="0,-30"><span class="cs-arrow">↑</span>下方</button><button type="button" class="cursor-interaction" data-preset="45,-30"><span class="cs-arrow">↖</span>右下</button>
      </div>
      <div class="cs-slider"><div class="cs-slider-head"><label for="cs-azimuth">水平</label><output for="cs-azimuth" data-az-value>255°</output></div><input id="cs-azimuth" type="range" min="0" max="360" step="1" value="255"/><div class="cs-ticks"><span>0</span><span>45</span><span>90</span><span>135</span><span>180</span><span>225</span><span>270</span><span>315</span><span>360</span></div></div>
      <div class="cs-slider"><div class="cs-slider-head"><label for="cs-elevation">垂直</label><output for="cs-elevation" data-el-value>40°</output></div><input id="cs-elevation" type="range" min="-30" max="60" step="1" value="40"/><div class="cs-ticks"><span>-30</span><span>0</span><span>30</span><span>60</span></div></div>
      <div class="cs-slider"><div class="cs-label" id="framing-label">景别</div><div class="cs-framing" role="group" aria-labelledby="framing-label"><button type="button" data-distance="0" aria-pressed="false">特写</button><button type="button" data-distance="50" aria-pressed="true">标准</button><button type="button" data-distance="100" aria-pressed="false" title="镜头后退，主体更小，展示更多环境">远景</button></div></div>
      <div class="cs-footer"><span class="cs-status" aria-live="polite">正在连接 MaaS…</span><button class="cs-generate" type="button" disabled>生成</button></div>
    </div>
  </div>
</section>

</div>

<p class="note">大图自动等比缩至长边 2048px 左右，直接按此尺寸生成；小图不放大。机位相对于原图。调整机位与景别后点击生成；角度与景别为生成目标，实际效果以出图为准。</p>
<section class="results" hidden aria-label="实际生成结果"><div class="result-head"><h2>生成结果</h2><a data-download download="multi-angle.png">下载结果 ↗</a></div><div class="comparison"><figure><figcaption>原图</figcaption><img data-original alt="本次生成的原图"></figure><figure><figcaption data-result-label>新机位</figcaption><img data-result alt="MaaS 实际生成结果"></figure></div><p class="run-meta"></p></section>
</main><script type="module" src="/camera.js"></script></body></html>
